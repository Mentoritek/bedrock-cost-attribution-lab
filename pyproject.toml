[project]
name = "bedrock-cost-attribution-lab"
version = "0.1.0"
description = "Split Amazon Bedrock spend by team, application and prompt — a reproducible AWS lab."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["cdk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
